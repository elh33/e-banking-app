<div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Mot de passe oublié</h2>
        <p>Recevez un lien de réinitialisation</p>
      </div>
  
      <div class="auth-body">
        <!-- Message de succès -->
        <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>
        
        <!-- Message d'erreur -->
        <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
        
        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
          <!-- Email -->
          <div class="form-group">
            <label for="email">Email</label>
            <input 
              type="email" 
              id="email" 
              formControlName="email" 
              placeholder="Votre email"
              [ngClass]="{ 'is-invalid': submitted && f['email'].errors }"
            >
            <div *ngIf="submitted && f['email'].errors" class="error-message">
              <div *ngIf="f['email'].errors['required']">L'email est requis</div>
              <div *ngIf="f['email'].errors['email']">Entrez un email valide</div>
            </div>
          </div>
  
          <!-- Bouton d'envoi -->
          <div class="form-group">
            <button type="submit" class="btn-submit" [disabled]="loading">
              <span *ngIf="loading" class="spinner"></span>
              <span *ngIf="!loading">Envoyer le lien</span>
            </button>
          </div>
  
          <!-- Lien de retour -->
          <div class="back-to-login">
            <a routerLink="/auth/login">Retour à la connexion</a>
          </div>
        </form>
      </div>
    </div>
  </div>
