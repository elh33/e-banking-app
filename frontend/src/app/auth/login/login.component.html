<div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h2>E-Banking App</h2>
        <p>Connectez-vous à votre compte</p>
      </div>
  
      <div class="auth-body">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <!-- Afficher les erreurs -->
          <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
  
          <!-- Email -->
          <div class="form-group">
            <label for="email">Email</label>
            <input 
              type="email" 
              id="email" 
              formControlName="email" 
              placeholder="Votre email"
              [ngClass]="{ 'is-invalid': submitted && f['email'].errors }"
            >
            <div *ngIf="submitted && f['email'].errors" class="error-message">
              <div *ngIf="f['email'].errors['required']">L'email est requis</div>
              <div *ngIf="f['email'].errors['email']">Entrez un email valide</div>
            </div>
          </div>
  
          <!-- Mot de passe -->
          <div class="form-group">
            <label for="password">Mot de passe</label>
            <input 
              type="password" 
              id="password" 
              formControlName="password" 
              placeholder="Votre mot de passe"
              [ngClass]="{ 'is-invalid': submitted && f['password'].errors }"
            >
            <div *ngIf="submitted && f['password'].errors" class="error-message">
              <div *ngIf="f['password'].errors['required']">Le mot de passe est requis</div>
            </div>
          </div>
  
          <!-- Bouton de connexion -->
          <div class="form-group">
            <button type="submit" class="btn-login" [disabled]="loading">
              <span *ngIf="loading" class="spinner"></span>
              <span *ngIf="!loading">Se connecter</span>
            </button>
          </div>
  
          <!-- Lien vers "Mot de passe oublié" -->
          <div class="forgot-password">
            <a routerLink="/auth/forgot-password">Mot de passe oublié?</a>
          </div>
        </form>
      </div>
  
      <!-- Informations de compte de test -->
      <div class="test-accounts">
        <h3>Comptes de test:</h3>
        <ul>
          <li><strong>Admin:</strong> admin&#64;ebank.com / admin123</li>
          <li><strong>Agent:</strong> agent&#64;ebank.com / agent123</li>
          <li><strong>Client:</strong> client&#64;ebank.com / client123</li>
        </ul>
      </div>
    </div>
  </div>
