<div class="sidebar-container">
  <div class="brand">
    <span class="brand-text">E-Banking</span>
    <span class="role-label">Agent</span>
  </div>

  <div class="nav-items">
    <div class="nav-item" routerLink="/agent/dashboard" routerLinkActive="active">
      <fa-icon [icon]="faHome"></fa-icon>
      <span>Tableau de bord</span>
    </div>

    <div class="nav-item" routerLink="/agent/clients" routerLinkActive="active">
      <fa-icon [icon]="faUsers"></fa-icon>
      <span>Clients</span>
    </div>

    <div class="nav-item" routerLink="/agent/enrollments" routerLinkActive="active">
      <fa-icon [icon]="faIdCard"></fa-icon>
      <span>Inscriptions</span>
    </div>

    <div class="nav-item" routerLink="/agent/subscribers" routerLinkActive="active">
      <fa-icon [icon]="faMoneyBillWave"></fa-icon>
      <span>Abonnés</span>
    </div>

    <div class="nav-item" routerLink="/agent/accounts" routerLinkActive="active">
      <fa-icon [icon]="faCreditCard"></fa-icon>
      <span>Comptes</span>
    </div>

    <div class="nav-item" routerLink="/agent/contracts" routerLinkActive="active">
      <fa-icon [icon]="faFileContract"></fa-icon>
      <span>Contrats</span>
    </div>

    <div class="nav-item logout-item" (click)="openLogoutConfirm()">
      <fa-icon [icon]="faSignOutAlt"></fa-icon>
      <span>Déconnexion</span>
    </div>
  </div>

  <!-- Logout confirmation modal -->
  <div *ngIf="showLogoutConfirm" class="logout-confirm-overlay">
    <div class="logout-confirm-modal">
      <div class="logout-confirm-header">
        <h3>Confirmation</h3>
      </div>
      <div class="logout-confirm-body">
        <p>Êtes-vous sûr de vouloir vous déconnecter ?</p>
      </div>
      <div class="logout-confirm-footer">
        <button class="cancel-btn" (click)="cancelLogout()">Annuler</button>
        <button class="confirm-btn" (click)="confirmLogout()">Déconnecter</button>
      </div>
    </div>
  </div>
</div>
